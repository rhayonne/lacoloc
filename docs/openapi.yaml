        bailleur_adresse: { type: string, nullable: true }
        nouvelle_adresse: { type: string, nullable: true, description: "EDL de sortie" }
        lieu_redaction: { type: string, nullable: true, description: "Fait à ___" }
        nombre_exemplaires: { type: string, nullable: true }
