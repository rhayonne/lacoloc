    AddressSuggestion:
      type: object
      description: "Value object Dart: AddressSuggestion (resposta de api-adresse.data.gouv.fr)"
      properties:
        label: { type: string }
        city: { type: string }
        postcode: { type: string }
        department: { type: string }
        region: { type: string }
    ChambreFilter:
      type: object
      description: "Estado de filtro (client-side) — model Dart ChambreFilter"
      properties:
        optionIds: { type: array, items: { type: integer } }
        city: { type: string }
        region: { type: string }
        department: { type: string }
        bailType: { type: string, nullable: true, enum: [location, individuel] }
        meublee: { type: boolean, nullable: true, description: "MODULE `meuble` — croise Immeubles.location_meuble" }
        typeImmeubleId: { type: integer, nullable: true, description: "MODULE `typeImmeuble` — Immeuble_Types_Reference" }
        equipements: { type: array, items: { type: string }, description: "MODULE `equipements` — **noms** d'équipements (Set<String>), issus de la RPC chambre_equipements_annonce (Inventaire dans_annonce)" }
        m2Min: { type: number, nullable: true }
        m2Max: { type: number, nullable: true }
        prixMin: { type: number, nullable: true }
        prixMax: { type: number, nullable: true }
        masquerLouees: { type: boolean, default: false, description: "MODULE `disponibilite` — par défaut les chambres louées restent visibles" }
        disponibleAPartirDe: { type: string, format: date, nullable: true, description: "MODULE `disponibilite` — ne garde que les chambres libres au plus tard à cette date (RPC chambre_disponibilite)" }

    ChambreDisponibilite:
      type: object
      description: "Modelo Dart: ChambreDisponibiliteModel (retour de la RPC chambre_disponibilite)"
      properties:
        chambre_id: { type: integer }
        disponible: { type: boolean }
        date_disponible: { type: string, format: date, nullable: true }

    # ───────── Edge functions ─────────
    InviteLocataireRequest:
      type: object
      properties:
        fullName: { type: string }
        email: { type: string, format: email }
        proprietaireId: { type: string, format: uuid }
        phone: { type: string, nullable: true }
        dateOfBirth: { type: string, format: date, nullable: true }
        resend: { type: boolean, description: "true para reenviar" }
        userId: { type: string, format: uuid, description: "obrigatório no modo resend" }
    InviteLocataireResponse:
      type: object
      properties:
        userId: { type: string, format: uuid, nullable: true }
        emailSent: { type: boolean }
        smtpError: { type: string, nullable: true }

    # ───────── Messagerie ─────────
    Message:
      type: object
      description: |
        Modelo Dart: MessageModel (tabela Messages). Un message d'un fil rattaché à une
        demande de contact. `sender_id`/`recipient_id` sont **dénormalisés** (au lieu de
        remonter à la demande) pour garder la RLS SELECT triviale — voir le path.
      properties:
        id: { type: integer }
        demande_id: { type: integer, description: "FK Demandes_Contact (ON DELETE CASCADE) — un fil par demande" }
        sender_id: { type: string, format: uuid, description: "FK Users_Client" }
        recipient_id: { type: string, format: uuid, description: "L'autre partie de la demande (DemandeContactModel.interlocuteurId)" }
        body: { type: string, description: "1 à 4000 caractères (contrainte en base)" }
        created_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time, nullable: true, description: "null = non lu (alimente les pastilles)" }
        sender: { type: object, description: "embed", properties: { full_name: { type: string } } }
    MessageWrite:
      type: object
      required: [demande_id, sender_id, recipient_id, body]
      properties:
        demande_id: { type: integer }
        sender_id: { type: string, format: uuid, description: "Doit être auth.uid() (RLS)" }
        recipient_id: { type: string, format: uuid }
        body: { type: string }

    # ───────── Garants ─────────
    Garant:
      type: object
      description: |
        Modelo Dart: GarantModel (tabela Garants). Appartient au **locataire**
        (`locataire_id`) ; les garants **actifs** sont repris automatiquement dans le bail.
        RLS : le locataire gère les siens, le proprietaire lit ceux de ses locataires (via EDL).
      properties:
        id: { type: integer }
        locataire_id: { type: string, format: uuid }
        type_garant: { type: string, description: "Personne physique / morale" }
        type_caution: { type: string, description: "Simple / solidaire" }
        is_active: { type: boolean, default: true, description: "Activé → ajouté aux baux générés" }
        nom: { type: string }
        prenom: { type: string, nullable: true }
        date_naissance: { type: string, format: date, nullable: true }
        lieu_naissance: { type: string, nullable: true }
        nationalite: { type: string, nullable: true }
        adresse: { type: string, nullable: true }
        code_postal: { type: string, nullable: true }
        ville: { type: string, nullable: true }
        email: { type: string, nullable: true }
        telephone: { type: string, nullable: true }
        profession: { type: string, nullable: true }
        employeur: { type: string, nullable: true }
        revenu_mensuel_net: { type: number, nullable: true }
        iban: { type: string, nullable: true }
        bic: { type: string, nullable: true }
        titulaire_compte: { type: string, nullable: true }
        raison_sociale: { type: string, nullable: true, description: "Personne morale" }
        siret: { type: string, nullable: true, description: "Personne morale" }
        representant_legal: { type: string, nullable: true, description: "Personne morale" }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    GarantWrite:
      type: object
      required: [locataire_id, nom]
      description: "Espelha GarantModel.toInsert(). Mesmos campos que Garant, sem id/created_at."
      properties:
        locataire_id: { type: string, format: uuid }
        type_garant: { type: string }
        type_caution: { type: string }
        is_active: { type: boolean }
        nom: { type: string }
        prenom: { type: string, nullable: true }
        date_naissance: { type: string, format: date, nullable: true }
        adresse: { type: string, nullable: true }
        code_postal: { type: string, nullable: true }
        ville: { type: string, nullable: true }
        email: { type: string, nullable: true }
        telephone: { type: string, nullable: true }
        profession: { type: string, nullable: true }
        employeur: { type: string, nullable: true }
        revenu_mensuel_net: { type: number, nullable: true }
        raison_sociale: { type: string, nullable: true }
        siret: { type: string, nullable: true }
        representant_legal: { type: string, nullable: true }
        notes: { type: string, nullable: true }
    EdlGarant:
      type: object
      description: "Tabela de ligação etat_de_lieux_garants (garant rattaché à un bail). Permet un garant **par preneur** en bail location, sans schéma supplémentaire."
      properties:
        id: { type: integer }
        etat_de_lieux_id: { type: integer }
        garant_id: { type: integer }
        created_at: { type: string, format: date-time }
        Garants: { $ref: '#/components/schemas/Garant' }

    # ───────── Notifications ─────────
    Notification:
      type: object
      description: |
        Modelo Dart: NotificationModel (tabela Notifications). **RLS por `recipient_id`** —
        le même endpoint sert proprietaire et locataire. INSERT uniquement via les RPC.
      properties:
        id: { type: integer }
        proprietaire_id: { type: string, format: uuid, description: "Legado — le destinataire effectif est `recipient_id`" }
        recipient_id: { type: string, format: uuid, nullable: true, description: "**Destinataire effectif** (proprietaire OU locataire). Null sur les lignes legadas → vaut `proprietaire_id`." }
        type: { type: string, enum: [edl_accepte, edl_addition, edl_a_signer, bail_garant_requis, bail_remplissage, admin_message, nouvelle_demande] }
        title: { type: string }
        body: { type: string, nullable: true, description: "Markdown (rendu sans HTML brut)" }
        etat_de_lieux_id: { type: integer, nullable: true }
        locataire_id: { type: string, format: uuid, nullable: true }
        is_read: { type: boolean, default: false }
        media_type: { type: string, nullable: true, enum: [image, youtube], description: "Messages du super admin" }
        media_url: { type: string, nullable: true }
        admin_message_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
    AdminMessage:
      type: object
      description: "Modelo Dart: AdminMessageModel (tabela Admin_Messages). Historique des diffusions du super admin (onglet Historique de Communication)."
      properties:
        id: { type: integer }
        sender_id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string, nullable: true }
        media_type: { type: string, nullable: true }
        media_url: { type: string, nullable: true }
        audience: { type: string, nullable: true, description: "tous / type / groupe / utilisateurs" }
        recipients_count: { type: integer }
        created_at: { type: string, format: date-time }

    # ───────── Thèmes ─────────
    ThemeRef:
      type: object
      description: |
        Modelo Dart: ThemeRef (tabela Themes_Reference) → `ThemeRef.palette`.
        **3 couleurs** suffisent : le reste (surfaces, bordures, texte secondaire, containers,
        on-colors) est **dérivé** par `PaletteBuilder`, avec correction automatique du
        contraste (AA 4.5:1) — les ajustements sont signalés (`PaletteDerivation.warnings`),
        jamais silencieux. Le **vert de succès** et le **rouge d'erreur** ne sont **pas**
        dérivés (ils sont sémantiques).
      properties:
        id: { type: integer }
        code: { type: string, description: "Référencé par Users_Client.theme_preference" }
        label: { type: string }
        description: { type: string, nullable: true }
        color_surface: { type: string, nullable: true, description: "Fond de page (hex). Null pour un thème `is_builtin`." }
        color_on_surface: { type: string, nullable: true, description: "Texte (hex)" }
        color_primary: { type: string, nullable: true, description: "Action (hex)" }
        is_builtin: { type: boolean, description: "Palette réglée à la main dans le code (Ardoise, Ocre, Encre) : non supprimable, sans couleurs en base — elle ne passe pas par PaletteBuilder." }
        is_active: { type: boolean, description: "Proposé aux utilisateurs" }
        is_default: { type: boolean, description: "Thème principal. Un index unique garantit qu'il n'y en a **qu'un**." }
        ordre: { type: integer }
        created_at: { type: string, format: date-time }
    ThemeRefWrite:
      type: object
      required: [code, label]
      properties:
        code: { type: string }
        label: { type: string }
        description: { type: string, nullable: true }
        color_surface: { type: string, nullable: true }
        color_on_surface: { type: string, nullable: true }
        color_primary: { type: string, nullable: true }
        is_active: { type: boolean }
        is_default: { type: boolean }
        ordre: { type: integer }

    # ───────── Lots & charges ─────────
    ImmeubleLot:
      type: object
      description: "Modelo Dart: ImmeubleLotModel (tabela Immeuble_Lots). Catalogue du proprietaire ; `immeuble_id` nullable = lot non rattaché."
      properties:
        id: { type: integer }
        owner_id: { type: string, format: uuid, nullable: true }
        immeuble_id: { type: integer, nullable: true, description: "Rattachement (nullable)" }
        numero_lot: { type: string }
        type_lot: { type: string, enum: [habitation, cave, parking, grenier, autre] }
        batiment: { type: string, nullable: true }
        etage: { type: string, nullable: true }
        porte: { type: string, nullable: true }
        reference_cadastrale: { type: string, nullable: true }
        tantiemes: { type: number, nullable: true }
        tantiemes_total: { type: number, nullable: true }
        nom_copropriete: { type: string, nullable: true }
        adresse_copropriete: { type: string, nullable: true }
        syndic_fournisseur_id: { type: integer, nullable: true, description: "FK Fournisseurs (catégorie « Syndic / Copropriété »)" }
        description: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    ImmeubleCharge:
      type: object
      description: "Charge locative rattachée à un immeuble (tabela Immeuble_Charges). Le bail en hérite."
      properties:
        id: { type: integer }
        immeuble_id: { type: integer }
        charge_ref_id: { type: integer, description: "FK Charges_Reference" }
        type: { type: string, enum: [aucun, inclus, fixe, variable] }
        montant: { type: number, nullable: true, description: "€/mois — type=fixe" }
        created_at: { type: string, format: date-time }
    ChambreCharge:
      type: object
      deprecated: true
      description: "**Legado** (tabela Chambre_Charges) — les charges vivent au niveau de l'immeuble. Conservée pour les baux anciens."
      properties:
        id: { type: integer }
        chambre_id: { type: integer }
        charge_ref_id: { type: integer }
        type: { type: string }
        montant: { type: number, nullable: true }
        created_at: { type: string, format: date-time }

    # ───────── Agenda ─────────
    PlageOuverture:
      type: object
      description: "Modelo Dart: PlageOuvertureModel (tabela Plages_Ouverture). RLS owner-only."
      properties:
        id: { type: integer }
        owner_id: { type: string, format: uuid }
        jour_semaine: { type: integer, description: "Jour de la semaine (1 = lundi)" }
        heure_debut: { type: string, description: "HH:MM:SS" }
        heure_fin: { type: string, description: "HH:MM:SS" }
        type: { type: string, enum: [ouverture, pause], description: "`ouverture` = créneau réservable (blanc) · `pause` = indisponible (jaune). Hors plage → hachuré." }
        created_at: { type: string, format: date-time }

    # ───────── Signatures / audit / admin ─────────
    UserSignature:
      type: object
      description: "Assinatura guardada do utilizador (tabela user_signatures). `signature_url` = réf. `doc:<path>` dans le bucket privé `documents` → afficher via `PrivateImage`."
      properties:
        id: { type: integer }
        user_id: { type: string, format: uuid }
        signature_url: { type: string }
        updated_at: { type: string, format: date-time, nullable: true }
    SignatureAudit:
      type: object
      description: "Trilha de auditoria (tabela signature_audit), écrite par l'edge function `record-signature-audit`."
      properties:
        id: { type: integer }
        etat_de_lieux_id: { type: integer }
        document_type: { type: string, enum: [edl, bail], description: "EDL et bail sont **deux** documents, avec des signatures indépendantes" }
        role: { type: string, enum: [proprietaire, locataire] }
        signer_id: { type: string, format: uuid }
        signer_email: { type: string, nullable: true }
        document_hash: { type: string }
        ip_address: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        signed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    ConnectionLog:
      type: object
      description: "Journal de connexions (tabela connection_logs), alimenté par l'edge function `log-connection`. Super admin → Maintenance → Connexions."
      properties:
        id: { type: integer }
        user_id: { type: string, format: uuid, nullable: true }
        user_email: { type: string, nullable: true }
        user_name: { type: string, nullable: true }
        user_type: { type: string, nullable: true }
        ip_address: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        device: { type: string, nullable: true }
        browser: { type: string, nullable: true }
        timezone: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    Entreprise:
      type: object
      description: "Modelo Dart: EntrepriseModel (tabela Entreprises). Gérée par le super admin (ComptesEntreprisesPage)."
      properties:
        id: { type: integer }
        name: { type: string }
        domain: { type: string, nullable: true }
        active: { type: boolean }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
