        locataire_accepte: { type: boolean }
        date_finalisation: { type: string, format: date }
        montant: { type: number }
        notes: { type: string }
        actif: { type: boolean }
        avenant_window_days: { type: integer }
        bail_avec_garant: { type: boolean }
        caution_mode: { type: string }
        caution_details: { type: object }
        date_debut_bail: { type: string, format: date }
        date_fin_bail: { type: string, format: date }
        duree_bail_mois: { type: integer }
        preavis_mois: { type: integer }
        bail_conge_date: { type: string, format: date, nullable: true }
        bail_fin_effective: { type: string, format: date, nullable: true }
        bail_resilie_motif: { type: string, nullable: true }
        bail_resilie_at: { type: string, format: date-time, nullable: true }
        proprietaire_signature_url: { type: string }
        proprietaire_signed_at: { type: string, format: date-time }
        locataire_signature_url: { type: string }
        locataire_signed_at: { type: string, format: date-time }
        bail_proprietaire_signature_url: { type: string }
        bail_proprietaire_signed_at: { type: string, format: date-time }
        bail_locataire_signature_url: { type: string }
