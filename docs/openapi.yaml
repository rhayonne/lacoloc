  # ───────────────────── ETAT_DE_LIEUX_GARANTS ────────────────────
  /rest/v1/etat_de_lieux_garants:
    get:
      tags: [EtatDesLieux, Garants]
      summary: Garants rattachés à un bail (EtatDesLieuxDatasource.listGarantsForEdl)
      description: "Table de liaison EDL ↔ Garants. RLS via `can_access_edl`. Embed usuel : `Garants!garant_id(*)`."
      parameters: [ { $ref: '#/components/parameters/select' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EdlGarant' } } } } }
    post:
      tags: [EtatDesLieux, Garants]
      summary: Rattacher un garant au bail (linkGarant)
      requestBody: { content: { application/json: { schema: { type: object, required: [etat_de_lieux_id, garant_id], properties: { etat_de_lieux_id: { type: integer }, garant_id: { type: integer } } } } } }
      responses: { '201': { description: Criado } }
    delete:
      tags: [EtatDesLieux, Garants]
      summary: Détacher un garant (unlinkGarant)
      parameters:
        - { name: etat_de_lieux_id, in: query, required: true, schema: { type: integer } }
        - { name: garant_id, in: query, required: true, schema: { type: integer } }
      responses: { '204': { description: Removido } }

  # ───────────────────────────── GARANTS ──────────────────────────
  /rest/v1/Garants:
    get:
      tags: [Garants]
      summary: Listar garants (GarantsDatasource.listByLocataire / activeByLocataires)
      description: |
        Garants **du locataire**. RLS : le locataire gère les siens ; le proprietaire lit ceux
        de ses locataires (via EDL). Les garants **actifs** (`is_active`) sont repris
        automatiquement dans le bail. `activeByLocataires` récupère les garants de tous les
        preneurs **en une requête** (évite le N+1 du bail location).
      parameters: [ { name: locataire_id, in: query, schema: { type: string, format: uuid } }, { name: is_active, in: query, schema: { type: boolean } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Garant' } } } } }
    post:
      tags: [Garants]
      summary: Criar garant (GarantsDatasource.create)
      description: "Après création/activation, `EtatDesLieuxDatasource.autoLinkGarantsForLocataire` rattache le garant aux baux **en édition** « avec garant » où il manque, et marque lue la notification `bail_garant_requis`."
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/GarantWrite' } } } }
      responses: { '201': { description: Criado, content: { application/json: { schema: { $ref: '#/components/schemas/Garant' } } } } }
    patch:
      tags: [Garants]
      summary: Atualizar garant / (dés)activer (update, setActive)
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/GarantWrite' } } } }
      responses: { '200': { description: OK } }
    delete:
      tags: [Garants]
      summary: Apagar garant (delete)
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      responses: { '204': { description: Removido } }

  # ───────────────────────────── RECETTES ─────────────────────────
  /rest/v1/Recettes:
    get:
      tags: [Finances]
      summary: Listar échéances (RecettesDatasource.listByOwner / listByLocataire)
      description: |
        Une **seule** ligne vue des deux côtés : le proprietaire via `owner_id`, le locataire
        via `locataire_id` (RLS `locataire_select_recettes`). Les libellés s'inversent selon
        `sens` (`_RecetteStatutBadge` / `_LocStatutBadge`). Alimente la Vue générale de
        Finances (Aujourd'hui / Ce mois-ci / En retard / À payer).
      parameters: [ { $ref: '#/components/parameters/select' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Recette' } } } } }
    post:
      tags: [Finances]
      summary: Criar échéance (generateFromBail / createManual / ensureBailEcheances)
      description: |
        ⚠️ **INSERT réservé au proprietaire** (`owner_all_recettes`).
        `generateFromBail` (idempotente) s'exécute quand **les deux** signatures du bail
        existent : caution (loyer × `depot_garantie_mois`) + 1 échéance par mois du bail.
        Quand le locataire signe en dernier, le rattrapage est `ensureBailEcheances(id)`,
        appelé à l'ouverture proprietaire. Les deux renvoient un `EcheanceGenResult`
        (`generated` / `alreadyExists` / `bailNotFullySigned` / `missingDateDebutBail` /
        `missingLoyer` / `missingDuree`…) — jamais d'échec silencieux : la cause exacte
        s'affiche dans le bandeau `_EcheanceDiagBanner`.
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/RecetteWrite' } } } }
      responses: { '201': { description: Criado } }
    patch:
      tags: [Finances]
      summary: Marcar paga / ajustar (markRecu, prorata)
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/RecetteWrite' } } } }
      responses: { '200': { description: OK } }
    delete:
      tags: [Finances]
      summary: Apagar échéances futuras (deleteFutureInstallments — résiliation)
      description: "Appelé par `resilierBail`. `annulerResiliation` les restaure via `regenerateMissingInstallments` (réinsère les dates manquantes et réaligne au plein toute ligne prorata **non payée**)."
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      responses: { '204': { description: Removido } }

  # ───────────────────────────── VETUSTE ──────────────────────────
  /rest/v1/vetuste_bareme:
    get:
      tags: [Vetuste]
      summary: Barème de vétusté (VetusteDatasource.listBareme)
      description: "1 ligne par **catégorie de meuble**, par proprietaire. À la 1ère lecture, `_seedDefaults` sème automatiquement des valeurs par défaut."
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VetusteBareme' } } } } }
    post:
      tags: [Vetuste]
      summary: Criar linha do barème (upsertBareme / _seedDefaults)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/VetusteBareme' } } } }
      responses: { '201': { description: Criado } }
    patch:
      tags: [Vetuste]
      summary: Atualizar barème (edição inline, salva no onTapOutside)
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/VetusteBareme' } } } }
      responses: { '200': { description: OK } }

  /rest/v1/vetuste_decompte:
    get:
      tags: [Vetuste]
      summary: Décomptes de réparations locatives (listDecomptes / findByEdl)
      description: "Embed : `vetuste_decompte_ligne(*)`. Un décompte **par EDL** → privatif et parties communes restent séparés."
      parameters: [ { $ref: '#/components/parameters/select' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VetusteDecompte' } } } } }
    post:
      tags: [Vetuste]
      summary: Criar décompte (proposerVetusteSiDegradation / ajout manuel)
      description: "Proposé à la finalisation d'un EDL de **sortie** si des dégradations sont détectées (`buildCandidatesForSortie` compare les lignes sortie ↔ entrée couplée). Idempotent via `findByEdl`."
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/VetusteDecompte' } } } }
      responses: { '201': { description: Criado } }
    patch:
      tags: [Vetuste]
      summary: Atualizar décompte (updateDecompte — statut genere, recette_id)
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/VetusteDecompte' } } } }
      responses: { '200': { description: OK } }
    delete:
      tags: [Vetuste]
      summary: Apagar décompte
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      responses: { '204': { description: Removido } }

  /rest/v1/vetuste_decompte_ligne:
    post:
      tags: [Vetuste]
      summary: Ajouter une ligne
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/VetusteDecompteLigne' } } } }
      responses: { '201': { description: Criado } }
    patch:
      tags: [Vetuste]
      summary: Atualizar ligne (imputable, valeur d'achat → recalcul live)
      description: "`VetusteCalc` : `abattement% = clamp((âge − franchise) × coef_annuel, 0, 100 − résiduel_min)` ; `valeur_résiduelle = valeur_achat × (1 − abattement/100)`."
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/VetusteDecompteLigne' } } } }
      responses: { '200': { description: OK } }
    delete:
      tags: [Vetuste]
      summary: Remover ligne
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      responses: { '204': { description: Removido } }

  # ─────────────────────────── NOTIFICATIONS ──────────────────────
  /rest/v1/Notifications:
    get:
      tags: [Notifications]
      summary: Listar notificações (NotificationsDatasource.listByOwner / unreadCount)
      description: |
        **RLS por `recipient_id = auth.uid()`** — le même endpoint sert au proprietaire et au
        locataire (chacun ne voit que les siennes). `proprietaire_id` reste pour les lignes
        legadas. **INSERT interdit en direct** : uniquement via les RPC `notify_edl_*` /
        `admin_broadcast_notification`.
        Types : `edl_accepte` · `edl_addition` · `edl_a_signer` · `bail_garant_requis` ·
        `bail_remplissage` · `admin_message`.
      parameters: [ { $ref: '#/components/parameters/select' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Notification' } } } } }
    patch:
      tags: [Notifications]
      summary: Marcar lida (markRead / markAllRead / markReadForEdl)
      description: "`markReadForEdl(edlId, {types})` nettoie les rappels « à signer » dès la signature — borné par RLS, chaque partie n'efface que les siennes."
      parameters: [ { name: id, in: query, schema: { type: integer } } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { is_read: { type: boolean } } } } } }
      responses: { '204': { description: OK } }
    delete:
      tags: [Notifications]
      summary: Apagar notificação
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      responses: { '204': { description: Removido } }

  /rest/v1/Admin_Messages:
    get:
      tags: [Notifications]
      summary: Histórico de difusões (CommunicationDatasource — onglet Historique)
      description: "Écrit par la RPC `admin_broadcast_notification`. Lecture réservée au super admin."
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminMessage' } } } } }

  # ───────────────────────── THEMES ───────────────────────────────
  /rest/v1/Themes_Reference:
    get:
      tags: [References]
      summary: Listar temas (ThemesDatasource)
      description: |
        **Lecture publique** (`anon`) : le visiteur a besoin du thème principal avant de se
        connecter. Écriture réservée au super admin (ThemesAdminPage).
        Un thème = **3 couleurs** (fond / texte / action) ; le reste est **dérivé** par
        `PaletteBuilder`. `is_builtin` = palette réglée à la main dans le code (Ardoise, Ocre,
        Encre) : non supprimable, sans couleurs en base. Un index unique garantit **un seul**
        `is_default`.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ThemeRef' } } } } }
    post:
      tags: [References]
      summary: Criar tema (super admin)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ThemeRefWrite' } } } }
      responses: { '201': { description: Criado } }
    patch:
      tags: [References]
      summary: Atualizar tema / (dés)activer / définir principal
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ThemeRefWrite' } } } }
      responses: { '200': { description: OK } }
    delete:
      tags: [References]
      summary: Apagar tema (não-builtin)
      description: "`Users_Client.theme_preference` est `ON DELETE SET NULL` → les utilisateurs concernés reviennent au thème principal."
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      responses: { '204': { description: Removido } }

  # ───────────────────── CHARGES / CATEGORIES ─────────────────────
  /rest/v1/Charges_Reference:
    get:
      tags: [References]
      summary: Charges locatives (ChargesReferenceDatasource)
      description: "Éditée par le Super Admin (ChargesReferencePage). ⚠️ `Chauffage` est une **charge locative**, pas un équipement d'inventaire."
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChargeReference' } } } } }
    post:
      tags: [References]
      summary: Criar charge (super admin)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ChargeReference' } } } }
      responses: { '201': { description: Criado } }
    patch:
      tags: [References]
      summary: Atualizar charge (super admin)
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ChargeReference' } } } }
      responses: { '200': { description: OK } }
    delete:
      tags: [References]
      summary: Apagar charge (super admin)
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      responses: { '204': { description: Removido } }

  /rest/v1/Meuble_Categories_Reference:
    get:
      tags: [References]
      summary: Categorias de móveis (MeubleCategoriesDatasource)
      description: "Le `nom` doit correspondre à `Meubles_Reference.categorie` — c'est la **clé du barème de vétusté**."
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MeubleCategory' } } } } }
    post:
      tags: [References]
      summary: Criar categoria (super admin)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/MeubleCategory' } } } }
      responses: { '201': { description: Criado } }
    patch:
      tags: [References]
      summary: Atualizar categoria (super admin)
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/MeubleCategory' } } } }
      responses: { '200': { description: OK } }
    delete:
      tags: [References]
      summary: Apagar categoria (super admin)
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      responses: { '204': { description: Removido } }

  /rest/v1/Immeuble_Charges:
    get:
      tags: [Finances]
      summary: Charges d'un immeuble (ImmeubleChargesDatasource)
      description: "Les charges sont définies **au niveau de l'immeuble** ; le bail de colocation en hérite (repli `BailPdfData.useChambreCharges` pour les données legadas de `Chambre_Charges`)."
      parameters: [ { name: immeuble_id, in: query, schema: { type: integer } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ImmeubleCharge' } } } } }
    post:
      tags: [Finances]
      summary: Ajouter une charge à l'immeuble
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ImmeubleCharge' } } } }
      responses: { '201': { description: Criado } }
    patch:
      tags: [Finances]
      summary: Atualizar charge
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ImmeubleCharge' } } } }
      responses: { '200': { description: OK } }
    delete:
      tags: [Finances]
      summary: Remover charge
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      responses: { '204': { description: Removido } }

  /rest/v1/Chambre_Charges:
    get:
      tags: [Finances]
      summary: Charges d'une chambre (LEGADO)
      deprecated: true
      description: "⚠️ **Legado** : le formulaire de chambre n'a plus de section « Charges » — elles vivent au niveau de l'immeuble (`Immeuble_Charges`). Conservée pour les baux anciens (repli `useChambreCharges`)."
      parameters: [ { name: chambre_id, in: query, schema: { type: integer } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChambreCharge' } } } } }

  # ─────────────────────────── IMMEUBLE_LOTS ──────────────────────
  /rest/v1/Immeuble_Lots:
    get:
      tags: [Patrimoine]
      summary: Lots de copropriété (LotsDatasource)
      description: |
        **Catalogue indépendant du proprietaire** — un lot existe par lui-même (`owner_id`) et
        est *rattaché* à un immeuble via `immeuble_id` (**nullable** : il peut rester non
        attribué). RLS = `owner_id = auth.uid()`. Embed usuel : le syndic
        (`Fournisseurs!syndic_fournisseur_id(nom, …)`).
      parameters: [ { $ref: '#/components/parameters/select' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ImmeubleLot' } } } } }
    post:
      tags: [Patrimoine]
      summary: Criar lot (showLotDialog)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ImmeubleLot' } } } }
      responses: { '201': { description: Criado } }
    patch:
      tags: [Patrimoine]
      summary: Atualizar lot / rattacher à un immeuble (assignToImmeuble)
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ImmeubleLot' } } } }
      responses: { '200': { description: OK } }
    delete:
      tags: [Patrimoine]
      summary: Apagar lot
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      responses: { '204': { description: Removido } }

  # ───────────────────────── PLAGES_OUVERTURE ─────────────────────
  /rest/v1/Plages_Ouverture:
    get:
      tags: [Visites]
      summary: Plages d'ouverture (PlagesOuvertureDatasource)
      description: "Disponibilités par jour de semaine. **RLS owner-only**. Pilotent la colorisation de la grille de l'Agenda : blanc = disponible, jaune = pause, hachuré = hors plage."
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PlageOuverture' } } } } }
    post:
      tags: [Visites]
      summary: Criar plage
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PlageOuverture' } } } }
      responses: { '201': { description: Criado } }
    patch:
      tags: [Visites]
      summary: Atualizar plage
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PlageOuverture' } } } }
      responses: { '200': { description: OK } }
    delete:
      tags: [Visites]
      summary: Remover plage
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      responses: { '204': { description: Removido } }

  # ──────────────────── SIGNATURES / AUDIT / LOGS ─────────────────
  /rest/v1/user_signatures:
    get:
      tags: [Signatures]
      summary: Assinatura guardada do utilizador (SignaturesDatasource.getSavedUrl)
      description: "Stockée dans le bucket **privé** `documents` (`signatures/{userId}/…`) → la valeur est une réf. `doc:<path>`, à résoudre en URL signée (`StorageService.resolveUrl`, widget `PrivateImage`). RLS : seul le propriétaire de la signature."
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UserSignature' } } } } }
    post:
      tags: [Signatures]
      summary: Guardar/atualizar assinatura (upsert)
      requestBody: { content: { application/json: { schema: { type: object, properties: { user_id: { type: string, format: uuid }, signature_url: { type: string } } } } } }
      responses: { '201': { description: Criado } }

  /rest/v1/signature_audit:
    get:
      tags: [Signatures]
      summary: Trilha de auditoria das assinaturas
      description: "Écrite par l'edge function `record-signature-audit` (`recordSignatureAudit`) : empreinte du document, IP et user-agent au moment de la signature. `document_type` distingue l'**EDL** du **bail** (deux documents, deux signatures)."
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SignatureAudit' } } } } }

  /rest/v1/connection_logs:
    get:
      tags: [Admin]
      summary: Journal de connexions (ConnectionLogsPage — super admin)
      description: "Alimenté par l'edge function `log-connection`. Consulté dans Maintenance → Connexions (avec WHOIS sur l'IP)."
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ConnectionLog' } } } } }

  /rest/v1/Entreprises:
    get:
      tags: [Admin]
      summary: Entreprises (ComptesEntreprisesPage — super admin)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Entreprise' } } } } }
    post:
      tags: [Admin]
      summary: Criar entreprise (super admin)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Entreprise' } } } }
      responses: { '201': { description: Criado } }
    patch:
      tags: [Admin]
      summary: Atualizar entreprise (super admin)
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Entreprise' } } } }
      responses: { '200': { description: OK } }

  # ───────────────────────────── MESSAGES ─────────────────────────
  /rest/v1/Messages:
    get:
      tags: [Contact]
      summary: Fil de discussion d'une demande (MessagesDatasource.listByDemande)
      description: |
        Messagerie entre le locataire et le proprietaire, **un fil par demande de
        contact**. Embed : `sender:Users_Client!sender_id(full_name)`.

        **RLS SELECT volontairement triviale** — `auth.uid() IN (sender_id, recipient_id)`,
        sur des colonnes **dénormalisées et indexées**. C'est cette politique qu'évalue
        `realtime.list_changes` à chaque événement : une RLS avec sous-requête (jointure
        vers Demandes_Contact → Immeubles) y coûterait cher et a déjà gelé le web
        (cf. `RealtimeService`). La table est donc **publiée en realtime** (le chat se
        met à jour tout seul).

        `MessagesDatasource.searchableTextByDemande(demandeIds)` — même endpoint,
        `select=demande_id,body` avec `demande_id=in.(…)` — alimente la **recherche**
        des écrans « Demandes de contact » / « Mes discussions » (nom du contact ou
        contenu des messages). Aucun filtre sender/recipient explicite n'est
        nécessaire : la RLS ci-dessus restreint déjà le résultat aux fils dont on
        est partie prenante.
      parameters:
        - { name: demande_id, in: query, schema: { type: integer } }
        - { $ref: '#/components/parameters/select' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Message' } } } } }
    post:
      tags: [Contact]
      summary: Envoyer un message (MessagesDatasource.send)
      description: |
        La vérification lourde est faite **ici** (coût négligeable, contrairement au
        SELECT). `with check` : `sender_id = auth.uid()` (pas d'usurpation)
        **et** `recipient_id <> auth.uid()` **et** `can_access_demande(demande_id)`
        (on est bien partie prenante) **et** `demande_est_acceptee(demande_id)` — le fil
        n'existe qu'une fois la demande **acceptée** par le proprietaire
        (`Demandes_Contact.contact_etabli = true`).
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/MessageWrite' } } } }
      responses:
        '201': { description: Criado }
        '403': { description: "Demande non acceptée, ou non partie prenante (refus RLS)" }
    patch:
      tags: [Contact]
      summary: Marquer comme lu (markReadForDemande)
      description: |
        Réservé au **destinataire** (`recipient_id = auth.uid()`). Le trigger
        `trg_messages_only_read_at` garantit que **seul `read_at`** peut bouger : un
        message ne se réécrit pas.
      parameters: [ { name: demande_id, in: query, schema: { type: integer } } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { read_at: { type: string, format: date-time } } } } } }
      responses: { '204': { description: OK } }
    delete:
      tags: [Contact]
      summary: Supprimer son propre message (delete)
      description: "RLS : `sender_id = auth.uid()` — on ne supprime que ses propres messages."
      parameters: [ { name: id, in: query, required: true, schema: { type: integer } } ]
      responses: { '204': { description: Removido } }

  # ───────────────────────────── RPC ──────────────────────────────
  /rest/v1/rpc/search_locataires:
    post:
      tags: [RPC]
      summary: Buscar locataires (EtatDesLieuxDatasource.searchLocataires)
      description: |
        `SECURITY DEFINER`. **Auth obrigatória** — `EXECUTE` revogado de `anon`/`PUBLIC`
        (só `authenticated`) e guarda interna: `auth.uid()` não-nulo **+**
        `current_user_role() ∈ {proprietaire, admin_groupe, super_admin}`. Devolve PII
        (nome/email/telefone), por isso não pode ser anónima.
      requestBody:
        content: { application/json: { schema: { type: object, properties: { search_query: { type: string } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UsersClient' } } } } }

  /rest/v1/rpc/list_invited_locataires:
    post:
      tags: [RPC]
      summary: Listar locataires convidados (listInvitedLocataires)
      description: |
        `SECURITY DEFINER`. **Auth obrigatória** — `EXECUTE` revogado de `anon`/`PUBLIC`;
        guarda interna: `p_proprietaire_id = auth.uid()` **ou** `is_super_admin()` (um gestor
        só vê os seus convidados). Retorna apenas convidados **ainda não ativados**
        (`auth.users.raw_user_meta_data->>'needs_completion' IS DISTINCT FROM 'false'`).
        Após o locataire concluir a ativação, ele some da lista.
      requestBody:
        content: { application/json: { schema: { type: object, properties: { p_proprietaire_id: { type: string } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UsersClient' } } } } }

  /rest/v1/rpc/notify_edl_locataire:
    post:
      tags: [RPC]
      summary: Notificar o(s) locataire(s) de um EDL (notifyEdlLocataire)
      description: |
        `SECURITY DEFINER`. Cria notificação(ões) `Notifications` com `recipient_id`
        derivado do EDL (privatif → `locataire_id`; commune → preneurs). Valida
        `can_access_edl`. Usado na finalização (evento `edl_a_signer`).
      requestBody:
        content: { application/json: { schema: { type: object, properties: { p_edl_id: { type: integer }, p_type: { type: string }, p_title: { type: string }, p_body: { type: string, nullable: true } } } } }
      responses:
        '200': { description: OK }

  /rest/v1/rpc/notify_edl_proprietaire:
    post:
      tags: [RPC]
      summary: Notificar o proprietário de um EDL (notifyEdlProprietaire)
      description: |
        `SECURITY DEFINER`. Crée une notification pour le **proprietaire de l'EDL** :
        le destinataire (`recipient_id`) est **dérivé du `proprietaire_id` de l'EDL**, donc
        non falsifiable. Valide `can_access_edl`. `EXECUTE` révoqué de `anon`/`PUBLIC`.
        Événements : `edl_accepte` (le locataire signe), `edl_addition` (addition du locataire).
      requestBody:
        content: { application/json: { schema: { type: object, properties: { p_edl_id: { type: integer }, p_type: { type: string }, p_title: { type: string }, p_body: { type: string, nullable: true } } } } }
      responses:
        '200': { description: OK }

  /rest/v1/rpc/admin_broadcast_notification:
    post:
      tags: [RPC]
      summary: Difundir uma mensagem (CommunicationDatasource.sendMessage)
      description: |
        `SECURITY DEFINER`, **réservée au super admin**. Enregistre l'`Admin_Messages` +
        1 `Notifications` (type `admin_message`) par destinataire, avec `media_type`/
        `media_url`/`admin_message_id`. Retourne l'id du message.
        Sécurité : écritures paramétrées (pas d'injection SQL) ; le rendu client est du
        **Markdown sans HTML brut** (pas de XSS), l'id YouTube est validé (11 caractères) et
        l'URL d'image limitée à http(s).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p_recipient_ids: { type: array, items: { type: string, format: uuid } }
                p_type: { type: string, default: admin_message }
                p_title: { type: string }
                p_body: { type: string, nullable: true, description: "Markdown" }
                p_media_type: { type: string, nullable: true, enum: [image, youtube] }
                p_media_url: { type: string, nullable: true }
                p_audience: { type: string, nullable: true, description: "tous / type / groupe / utilisateurs (traçabilité)" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: integer, description: "admin_message_id" } } } }

  /rest/v1/rpc/chambre_equipements_annonce:
    post:
      tags: [RPC]
      summary: Équipements « dans l'annonce » par chambre (InventaireDatasource.annonceLabelsByChambre / annonceEquipementNames)
      description: |
        `SECURITY DEFINER` (stable). Expose **uniquement les noms** des articles
        d'inventaire marqués `dans_annonce = true` (jointe à `Meubles_Reference`
        pour le `nom`, ou `nom_custom`), pour les chambres **actives** d'immeubles
        **actifs**. Ne fuite **aucune** donnée financière (valeur/valeur_achat) →
        `EXECUTE` accordé à `anon` + `authenticated` (la table `Inventaire` reste,
        elle, privée au propriétaire via RLS). Alimente la carte/fiche publique de
        la chambre et les chips du filtre « Équipements ».
        `p_chambre_ids = NULL` → toutes les chambres (liste distincte pour le filtre).
      requestBody:
        content: { application/json: { schema: { type: object, properties: { p_chambre_ids: { type: array, items: { type: integer }, nullable: true } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object, properties: { chambre_id: { type: integer }, nom: { type: string } } } } } } }

  /rest/v1/rpc/chambre_disponibilite:
    post:
      tags: [RPC]
      summary: Disponibilité + date de libération par chambre (ChambresDatasource.disponibiliteByIds)
      description: |
        `SECURITY DEFINER` (stable), même modèle que `chambre_equipements_annonce` :
        `EXECUTE` accordé à `anon` + `authenticated` (recherche publique de
        chambres), n'expose **aucune** identité de locataire ni montant.

        Les chambres louées restent affichées dans la recherche (par défaut) — le
        locataire doit pouvoir repérer ce qui va bientôt se libérer. Ce RPC calcule
        `disponible = NOT est_loue` et `date_disponible` :
        - chambre libre → `CURRENT_DATE` ;
        - chambre louée → `coalesce(bail_fin_effective, date_fin_bail)` de l'EDL
          **entrée** privatif actif le plus récent pour cette chambre, ou `null`
          si la fin du contrat n'est pas connue (ex. chambre marquée « louée »
          manuellement, sans EDL lié).

        Nécessaire car la RLS de `etat_de_lieux` est réservée aux parties du
        contrat — un visiteur qui parcourt les annonces ne peut pas lire la date
        de fin de bail directement.
        `p_chambre_ids = NULL` → toutes les chambres actives.
      requestBody:
        content: { application/json: { schema: { type: object, properties: { p_chambre_ids: { type: array, items: { type: integer }, nullable: true } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object, properties: { chambre_id: { type: integer }, disponible: { type: boolean }, date_disponible: { type: string, format: date, nullable: true } } } } } } }

  /rest/v1/rpc/notify_nouvelle_demande:
    post:
      tags: [RPC]
      summary: Notifier le propriétaire d'une nouvelle demande de contact (DemandesContactDatasource.create)
      description: |
        `SECURITY DEFINER` (même modèle que `notify_edl_proprietaire`). Insère une
        `Notifications` (type `nouvelle_demande`, `recipient_id` = owner_id de
        l'immeuble, dérivé côté serveur) pour que la demande apparaisse dans la
        section « Notifications » du tableau de bord du propriétaire. Vérifie que
        l'appelant est bien le **locataire** de cette demande — sinon exception
        (empêche de déclencher une notification sur une demande à laquelle on
        n'est pas partie). Appelée en best-effort juste après l'insertion de la
        demande ; un échec ne bloque pas la création de la demande elle-même.
      requestBody:
        content: { application/json: { schema: { type: object, properties: { p_demande_id: { type: integer } } } } }
      responses:
        '200': { description: OK }
        '400': { description: "demande introuvable, ou appelant non partie prenante (exception SQL)" }

  # ──────────────────────── EDGE FUNCTIONS ────────────────────────
  /functions/v1/invite-locataire:
    post:
      tags: [EdgeFunctions]
      summary: Convidar / reenviar convite de locataire
      description: |
        **🔒 Auth obrigatória (create/resend):** valida o JWT do chamador (`requireManager`)
        e exige `proprietaire`/`admin_groupe`/`super_admin` (401/403). Sem isto qualquer um
        podia criar contas ou redefinir a senha de outro utilizador (via `userId`) e desviar
        o link → roubo de conta.
        **create**: cria usuário com senha temp, grava `invited_by_proprietaire_id`,
        envia e-mail SMTP e marca `invitation_email_sent`.
        **resend** (`resend: true` + `userId`): define nova senha temp e reenvia o link.
        **test** (`test: true`, super_admin): e-mail de diagnóstico sem criar conta.
        **`mailTo`** (override de teste, modos create/resend) só honrado se for igual ao
        secret `DEV_TEST_EMAIL`; em prod o build não envia mailTo → link sempre ao e-mail real.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteLocataireRequest' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/InviteLocataireResponse' } } } }
        '400': { description: "Erro (ex: e-mail já existe)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { description: "Não autenticado" }
        '403': { description: "Sem permissão (não é gestor)" }

  /functions/v1/notify-edl:
    post:
      tags: [EdgeFunctions]
      summary: Notificar por e-mail um evento de EDL (accepte / addition / a_signer)
      description: |
        **🔒 Auth obrigatória + controlo de acesso:** valida o JWT e **lê o EDL com o
        cliente do chamador (RLS)** — se não pode ver o EDL, 403. Os destinatários são
        resolvidos server-side (service role) a partir do EDL. Campos de texto
        (`locataireNom`, `comodo`, `texte`) passam por escape HTML (anti-injeção).
        `mailTo` só honrado se for igual ao secret `DEV_TEST_EMAIL`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                edlId: { type: integer }
                event: { type: string, enum: [accepte, addition, a_signer] }
                locataireNom: { type: string, nullable: true }
                comodo: { type: string, nullable: true }
                texte: { type: string, nullable: true }
                mailTo: { type: string, nullable: true }
      responses:
        '200': { description: OK }
        '401': { description: "Não autenticado" }
        '403': { description: "Sem acesso a este EDL" }

  /functions/v1/delete-account:
    post:
      tags: [EdgeFunctions]
      summary: Apagar a própria conta (AuthService.deleteAccount)
      description: "Requer JWT. Bloqueia se houver `etat_de_lieux` com `locataire_id` = usuário."
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { success: { type: boolean } } } } } }
        '400': { description: "Possui contratos", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { description: "Não autorizado" }

  /functions/v1/notify-proprietaire:
    post:
      tags: [EdgeFunctions]
      summary: Notificar admin de novo cadastro de propriétaire (best-effort)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
                email: { type: string }
                phone: { type: string }
                note: { type: string }
      responses:
        '200': { description: Enviado (falhas são silenciosas no cliente) }

  /functions/v1/manage-user-auth:
    post:
      tags: [EdgeFunctions]
      summary: Bannir / débannir / définir un mot de passe (super admin)
      description: |
        **`verify_jwt: false` au gateway** — sinon le préflight CORS était bloqué
        (`Failed to fetch`) ; la fonction valide donc le JWT **elle-même**
        (`userClient.auth.getUser()`) et exige que l'appelant soit `super_admin` (ou
        `admin_groupe` de la même `entreprise_id` que la cible). Tout est dans un
        `try/catch` global qui renvoie toujours les en-têtes CORS (une erreur devient un
        message, pas un `Failed to fetch`).

        ⚠️ Note d'implémentation : les méthodes admin de supabase-js v2 sont
        `auth.admin.updateUserById` (**pas** `updateUser`).

        - `ban` / `unban` (via `UserManagementDatasource.toggleActive`) → définit `ban_duration`.
        - `set_password` (via `UserManagementDatasource.setUserPassword`) → min. 6 caractères.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId, action]
              properties:
                targetUserId: { type: string, format: uuid }
                action: { type: string, enum: [ban, unban, set_password] }
                newPassword: { type: string, nullable: true, description: "action=set_password, min. 6" }
      responses:
        '200': { description: OK }
        '401': { description: Não autenticado, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: Sem permissão, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /functions/v1/notify-rendezvous:
    post:
      tags: [EdgeFunctions, Visites]
      summary: Prévenir le contact d'un rendez-vous par e-mail
      description: |
        Envoyée à l'enregistrement d'un rendez-vous (Agenda). L'invité — locataire du système
        ou contact externe — reçoit le **type**, la **date/heure**, le **lieu** et
        l'**organisateur**.
        **Sécurité** : `verify_jwt: false` au gateway (comme `notify-edl`) mais la fonction
        valide le JWT et lit le rendez-vous **avec le client de l'appelant (RLS)** → le
        destinataire est résolu **côté serveur**, non falsifiable ; champs échappés (HTML).
        En dev, l'e-mail est redirigé vers `DEV_TEST_EMAIL`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                visiteId: { type: integer }
                mailTo: { type: string, nullable: true, description: "Honoré uniquement s'il est égal au secret serveur DEV_TEST_EMAIL" }
      responses:
        '200': { description: Enviado }

  /functions/v1/log-connection:
    post:
      tags: [EdgeFunctions, Admin]
      summary: Enregistrer une connexion (connection_logs)
      description: "`verify_jwt: true`. Écrit une ligne dans `connection_logs` (IP, user-agent, appareil, navigateur, fuseau) consultée par le super admin dans Maintenance → Connexions."
      responses:
        '200': { description: OK }

  /functions/v1/record-signature-audit:
    post:
      tags: [EdgeFunctions, Signatures]
      summary: Journaliser une signature (signature_audit)
      description: |
        `verify_jwt: true`. Appelée par `SignaturesDatasource.recordSignatureAudit` à chaque
        apposition de signature — **EDL** ou **bail** (`document_type`) — avec l'empreinte du
        document, l'IP et le user-agent. Le signataire est déduit du JWT.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                etat_de_lieux_id: { type: integer }
                document_type: { type: string, enum: [edl, bail] }
                role: { type: string, enum: [proprietaire, locataire] }
                document_hash: { type: string }
      responses:
        '200': { description: OK }

  # ───────────────────────────── STORAGE ──────────────────────────
  # Dois buckets: "photos" (público, conteúdo de anúncio) e "documents" (privado,
  # conteúdo sensível: assinaturas + fotos/observações de EDL). Ver StorageService.
  /storage/v1/object/photos/{path}:
    post:
      tags: [Storage]
      summary: Upload de foto pública (StorageService.upload → bucket "photos")
      description: |
        Conteúdo NÃO sensível (immeubles/chambres/pièces/inventaire). Guarda a URL
        pública na BD. O bucket não permite listing (só URLs diretas servem).
      parameters: [ { name: path, in: path, required: true, schema: { type: string } } ]
      requestBody:
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses: { '200': { description: "URL pública retornada" } }
    delete:
      tags: [Storage]
      summary: Apagar foto (StorageService.delete)
      parameters: [ { name: path, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Removido } }

  /storage/v1/object/documents/{path}:
    post:
      tags: [Storage]
      summary: Upload de conteúdo sensível (bucket privado "documents")
      description: |
        Conteúdo SENSÍVEL: assinaturas (`signatures/{userId}/…`) e fotos/observações de
        EDL (`etat_de_lieux/{edlId}/…`). Guarda uma referência `doc:<path>` na BD (não a URL).
        RLS em `storage.objects`: EDL → `can_access_edl(edlId)` (ambas as partes); assinaturas
        → só o dono. A exibição usa URL **assinada** (ver abaixo).
      parameters: [ { name: path, in: path, required: true, schema: { type: string } } ]
      requestBody:
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses: { '200': { description: "OK (guardar ref doc:<path>)" }, '403': { description: "Sem acesso (RLS)" } }
    delete:
      tags: [Storage]
      summary: Apagar conteúdo privado (StorageService.delete)
      parameters: [ { name: path, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Removido } }

  /storage/v1/object/sign/documents/{path}:
    post:
      tags: [Storage]
      summary: Gerar URL assinada temporária (StorageService.resolveUrl)
      description: |
        Para exibir conteúdo do bucket privado. O cliente (via PrivateImage) chama
        `createSignedUrl(path, 3600)`; só funciona se o utilizador passar a RLS de SELECT
        sobre o objeto. URL válida ~1h (cache em memória no cliente).
      parameters: [ { name: path, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: "signedURL" }, '403': { description: "Sem acesso (RLS)" } }

components:

  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: apikey
      description: Chave anon do projeto Supabase
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    select:
      name: select
      in: query
      schema: { type: string }
      description: "Colunas + embeds PostgREST, ex: *,Immeubles(name)"

  schemas:

    # ───────── Auth ─────────
    SignUpRequest:
      type: object
      required: [email, password, data]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        data:
          type: object
          description: raw_user_meta_data lido pelo trigger
          properties:
            full_name: { type: string }
            type_code: { type: string, enum: [locataire, proprietaire, super_admin] }
            phone: { type: string, nullable: true }
            date_of_birth: { type: string, format: date, nullable: true }
        emailRedirectTo: { type: string }
    AuthResponse:
      type: object
      properties:
        user: { type: object, nullable: true }
        session: { type: object, nullable: true }
    ErrorResponse:
      type: object
      properties:
        error: { type: string }

    # ───────── Users ─────────
    UserType:
      type: string
      description: enum Dart UserType (raw = code em User_Types_Reference)
      enum: [locataire, proprietaire, super_admin]
    UserTypeRef:
      type: object
      description: "Modelo Dart: UserTypeRef (tabela User_Types_Reference)"
      properties:
        id: { type: integer }
        code: { type: string, enum: [locataire, proprietaire, super_admin] }
        label: { type: string }
        description: { type: string, nullable: true }
    UsersClient:
      type: object
      description: |
        Modelo Dart: UsersClient (tabela Users_Client). Idade deve ser calculada de date_of_birth.

        RLS SELECT (croisée, en plus du propre profil) : `invited_by_proprietaire_id`,
        un `etat_de_lieux` partagé, **ou** `shares_demande_with(id)` — deux comptes
        qui partagent une `Demandes_Contact` (peu importe son état) se voient
        mutuellement (nom, e-mail, téléphone…), et uniquement l'un l'autre.
      properties:
        id: { type: string, format: uuid, description: "= auth.users.id" }
        created_at: { type: string, format: date-time }
        email: { type: string, format: email }
        full_name: { type: string, nullable: true }
        phone: { type: string, nullable: true, description: "formato internacional, ex +33612345678" }
        age: { type: integer, nullable: true, description: "fallback legado" }
        date_of_birth: { type: string, format: date, nullable: true }
        type_user_id: { type: integer, nullable: true }
        active: { type: boolean, default: true }
        invitation_email_sent: { type: boolean, default: false }
        invitation_sent_at: { type: string, format: date-time, nullable: true }
        invited_by_proprietaire_id: { type: string, format: uuid, nullable: true }
        group_id: { type: integer, nullable: true, description: "Groupe de permissions (trigger set_default_user_group)" }
        entreprise_id: { type: integer, nullable: true }
        theme_preference: { type: string, nullable: true, description: "FK → Themes_Reference.code. null = thème principal. `ON DELETE SET NULL` : supprimer un thème renvoie ses utilisateurs au principal. Appliqué au login si le thème est encore actif." }
        avenant_window_days: { type: integer, description: "Préférence globale **legado** : sert seulement de repli à la finalisation (getAvenantWindowDays). La fenêtre est désormais choisie PAR EDL (etat_de_lieux.avenant_window_days) ; il n'y a plus d'écran pour régler celle-ci." }
        User_Types_Reference: { $ref: '#/components/schemas/UserTypeRef' }
    UsersClientUpdate:
      type: object
      description: |
        ⚠️ **RLS/trigger** : `type_user_id` est verrouillé par `trg_prevent_role_self_escalation`
        — un utilisateur ne peut pas changer son propre type (le rôle en découle → escalade de
        privilèges). Seuls le service role, un super_admin, ou un admin_groupe agissant sur un
        **autre** compte peuvent le modifier.
      properties:
        full_name: { type: string }
        phone: { type: string, nullable: true }
        age: { type: integer }
        date_of_birth: { type: string, format: date }
        theme_preference: { type: string, nullable: true, description: "Choix de thème (ThemePickerSection, Mon Profil)" }
        type_user_id: { type: integer, description: "updateUserType (Super Admin) — voir le trigger ci-dessus" }
        active: { type: boolean, description: "toggleActive (Super Admin)" }
    PermissionRef:
      type: object
      description: "Modelo Dart: PermissionRef (tabela Permissions_Reference)"
      properties:
        id: { type: integer }
        key: { type: string }
        label: { type: string }
        description: { type: string, nullable: true }
        category: { type: string }
    UserPermission:
      type: object
      description: "Modelo Dart: UserPermission (tabela User_Permissions + embed)"
      properties:
        user_id: { type: string, format: uuid }
        permission_id: { type: integer }
        granted_at: { type: string, format: date-time }
        Permissions_Reference: { $ref: '#/components/schemas/PermissionRef' }
    UserPermissionWrite:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        permission_id: { type: integer }
        granted_by: { type: string, format: uuid }

    # ───────── Patrimoine ─────────
    ImmeubleType:
      type: object
      description: "Modelo Dart: ImmeubleTypeModel (tabela Immeuble_Types_Reference)"
      properties:
        id: { type: integer }
        name: { type: string }
    ReferenceItem:
      type: object
      description: "Modelo Dart: ReferenceItem (Options_Reference; id+name genérico)"
      properties:
        id: { type: integer }
        name: { type: string }
    Immeuble:
      type: object
      description: "Modelo Dart: ImmeublesModel (tabela Immeubles)"
      properties:
        id: { type: integer }
        owner_id: { type: string, format: uuid, nullable: true }
        type_id: { type: integer, nullable: true }
        name: { type: string }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        region: { type: string, nullable: true }
        department: { type: string, nullable: true }
        total_m2: { type: number, format: float, nullable: true }
        description: { type: string, nullable: true }
        common_photos: { type: array, items: { type: string }, description: "URLs (JSONB)" }
        main_photo: { type: string, nullable: true }
        is_active: { type: boolean, default: true }
        code_postal: { type: string, nullable: true, description: "Rempli depuis l'API BAN ; complété au save par _ensureLocationData si manquant" }
        bail_location: { type: boolean, default: false, description: "⚠️ Ex-`bail_collectif` (renommée). Location simple : plusieurs locataires, **un seul contrat**, pas de baux individuels. Affichée « Location » (ImmeublesModel.bailLocation). À ne pas confondre avec l'EDL *collectif* (= parties communes d'un bail individuel)." }
        bail_individuel: { type: boolean, default: false, description: "Colocation : 1 bail par chambre" }
        prix_loyer: { type: number, format: float, nullable: true }
        location_meuble: { type: boolean, nullable: true, description: "Oui/Non — si meublée, la génération des parties communes crée aussi l'inventaire" }
        depot_garantie_mois: { type: number, nullable: true, description: "Hérité par les chambres à leur création (max légal 2 mois meublé / 1 vide)" }
        duree_bail_mois: { type: integer, nullable: true, description: "Héritée par les chambres à leur création" }
        dpe_classe: { type: string, nullable: true, description: "Classe DPE (A–G)" }
        irl_reference: { type: string, nullable: true, description: "Référence IRL (indice de révision des loyers)" }
        entreprise_id: { type: integer, nullable: true, readOnly: true, description: "Posé par le trigger set_immeuble_entreprise" }
        created_at: { type: string, format: date-time, nullable: true }
        Immeuble_Types_Reference: { $ref: '#/components/schemas/ImmeubleType' }
    ImmeubleWrite:
      type: object
      required: [name]
      properties:
        owner_id: { type: string, format: uuid }
        type_id: { type: integer }
        name: { type: string }
        address: { type: string }
        total_m2: { type: number }
        description: { type: string }
        common_photos: { type: array, items: { type: string } }
        is_active: { type: boolean }
        main_photo: { type: string, nullable: true }
        city: { type: string }
        region: { type: string }
        department: { type: string }
        code_postal: { type: string }
        bail_location: { type: boolean }
        bail_individuel: { type: boolean }
        prix_loyer: { type: number }
        location_meuble: { type: boolean, nullable: true }
        depot_garantie_mois: { type: number }
        duree_bail_mois: { type: integer }
        dpe_classe: { type: string }
        irl_reference: { type: string }
    Chambre:
      type: object
      description: |
        Modelo Dart: ChambreModel (tabela Chambres). L'unité **louée** du système.
        ⚠️ `selected_options` = **legado** (anciens « équipements », ids de Options_Reference) :
        préservé mais **ni édité ni lu** par l'UI — les équipements sont désormais des lignes
        d'`Inventaire` avec `chambre_id` + `dans_annonce = true` (exposées publiquement par la
        RPC `chambre_equipements_annonce`).
      properties:
        id: { type: integer }
        immeuble_id: { type: integer }
        room_name: { type: string }
        m2: { type: number, format: float, nullable: true }
        description: { type: string, nullable: true }
        room_photos: { type: array, items: { type: string } }
        selected_options: { type: array, items: { type: integer }, deprecated: true, description: "LEGADO — migré vers Inventaire (dans_annonce)" }
        main_photo: { type: string, nullable: true }
        is_active: { type: boolean, default: true }
        prix_loyer: { type: number, format: float, nullable: true }
        est_loue: { type: boolean, default: false, description: "Piloté par la finalisation des EDL : entrée finalisée → true, sortie finalisée → false. Modifiable à la main uniquement sans bail lié." }
        depot_garantie_mois: { type: number, nullable: true, description: "Hérité de l'immeuble à la création, éditable. Montant caution = prix_loyer × ce nombre." }
        duree_bail_mois: { type: integer, nullable: true, description: "Héritée de l'immeuble à la création, éditable" }
        created_at: { type: string, format: date-time, nullable: true }
        Immeubles:
          type: object
          description: embed do imóvel
          properties:
            name: { type: string }
            address: { type: string }
            city: { type: string }
            region: { type: string }
            department: { type: string }
            bail_location: { type: boolean }
            bail_individuel: { type: boolean }
    ChambreWrite:
      type: object
      required: [immeuble_id, room_name]
      properties:
        immeuble_id: { type: integer }
        room_name: { type: string }
        m2: { type: number }
        description: { type: string }
        room_photos: { type: array, items: { type: string } }
        selected_options: { type: array, items: { type: integer }, deprecated: true }
        is_active: { type: boolean }
        prix_loyer: { type: number }
        est_loue: { type: boolean }
        main_photo: { type: string, nullable: true }
        depot_garantie_mois: { type: number }
        duree_bail_mois: { type: integer }
    PiecePhoto:
      type: object
      description: "Value object Dart: PiecePhoto (item de Pieces.photos)"
      properties:
        url: { type: string }
        dans_annonce: { type: boolean, default: false, description: "se aparece no anúncio público" }
    Piece:
      type: object
      description: "Modelo Dart: PieceModel (tabela Pieces)"
      properties:
        id: { type: integer }
        immeuble_id: { type: integer }
        nom: { type: string }
        m2: { type: number, format: float, nullable: true }
        description: { type: string, nullable: true }
        photos: { type: array, items: { $ref: '#/components/schemas/PiecePhoto' } }
        created_at: { type: string, format: date-time }
    PieceWrite:
      type: object
      required: [immeuble_id, nom, photos]
      properties:
        immeuble_id: { type: integer }
        nom: { type: string }
        m2: { type: number }
        description: { type: string }
        photos: { type: array, items: { $ref: '#/components/schemas/PiecePhoto' } }

    # ───────── Inventaire ─────────
    MeubleReference:
      type: object
      description: "Modelo Dart: MeubleReferenceModel (tabela Meubles_Reference)"
      properties:
        id: { type: integer }
        nom: { type: string }
        categorie: { type: string, nullable: true }
    MeubleReferenceWrite:
      type: object
      required: [nom]
      properties:
        nom: { type: string }
        categorie: { type: string, nullable: true }
    Inventaire:
      type: object
      description: "Modelo Dart: InventaireModel (tabela Inventaire). chambre_id e piece_id são mutuamente exclusivos."
      properties:
        id: { type: integer }
        immeuble_id: { type: integer }
        chambre_id: { type: integer, nullable: true }
        piece_id: { type: integer, nullable: true }
        meuble_ref_id: { type: integer, nullable: true }
        nom_custom: { type: string, nullable: true, description: "fallback legado se não houver meuble_ref_id" }
        valeur: { type: number, format: float, nullable: true }
        quantite: { type: integer, default: 1 }
        description: { type: string, nullable: true }
        photos: { type: array, items: { type: string } }
        dans_annonce: { type: boolean, default: false, description: "Si true, l'article (ex-« équipement » de chambre) apparaît sur la carte/fiche publique de la chambre. Les équipements migrés depuis Chambres.selected_options sont à true ; un nouvel article est créé décoché." }
        date_acquisition: { type: string, format: date, nullable: true, description: "Vétusté: date d'achat" }
        valeur_achat: { type: number, nullable: true, description: "Vétusté: prix d'achat (sert au calcul de la valeur résiduelle)" }
        categorie_vetuste: { type: string, nullable: true, description: "Catégorie de vétusté (override de la catégorie du meuble pour nom_custom)" }
        created_at: { type: string, format: date-time }
        meuble_ref: { $ref: '#/components/schemas/MeubleReference' }
        chambre: { type: object, properties: { id: { type: integer }, room_name: { type: string } } }
        piece: { type: object, properties: { id: { type: integer }, nom: { type: string } } }
    InventaireWrite:
      type: object
      required: [immeuble_id, quantite, photos]
      properties:
        immeuble_id: { type: integer }
        chambre_id: { type: integer, nullable: true }
        piece_id: { type: integer, nullable: true }
        meuble_ref_id: { type: integer, nullable: true }
        nom_custom: { type: string, nullable: true }
        valeur: { type: number }
        quantite: { type: integer }
        description: { type: string }
        photos: { type: array, items: { type: string } }
        dans_annonce: { type: boolean, default: false, description: "Afficher dans l'annonce de la chambre (décoché par défaut)" }
        date_acquisition: { type: string, format: date, nullable: true }
        valeur_achat: { type: number, nullable: true }
        categorie_vetuste: { type: string, nullable: true }
    MeubleCategory:
      type: object
      description: "Modelo Dart: MeubleCategoryModel (tabela Meuble_Categories_Reference). Editada pelo Super Admin (MeubleCategoriesPage)."
      properties:
        id: { type: integer }
        nom: { type: string }
        ordre: { type: integer }
    # ───────── Vétusté (Option B) ─────────
    VetusteBareme:
      type: object
      description: "Modelo Dart: VetusteBaremeModel (tabela vetuste_bareme). Barème par proprietaire, 1 ligne par catégorie de meuble."
      properties:
        id: { type: integer }
        owner_id: { type: string, format: uuid }
        categorie: { type: string }
        duree_vie_annees: { type: integer }
        franchise_annees: { type: integer }
        coefficient_annuel: { type: number, description: "%/an" }
        residuel_min_pct: { type: number, description: "% résiduel minimum" }
        created_at: { type: string, format: date-time }
    VetusteDecompte:
      type: object
      description: "Modelo Dart: VetusteDecompteModel (tabela vetuste_decompte). Décompte de réparations locatives lié à un immeuble (+ chambre/locataire/EDL)."
      properties:
        id: { type: integer }
        owner_id: { type: string, format: uuid }
        immeuble_id: { type: integer }
        chambre_id: { type: integer, nullable: true }
        locataire_id: { type: string, format: uuid, nullable: true }
        etat_de_lieux_id: { type: integer, nullable: true, description: "EDL de sortie d'origine (auto)" }
        titre: { type: string, nullable: true }
        statut: { type: string, enum: [brouillon, genere] }
        total_montant: { type: number }
        recette_id: { type: integer, nullable: true, description: "Recette « à recevoir » générée" }
        created_at: { type: string, format: date-time }
        vetuste_decompte_ligne: { type: array, items: { $ref: '#/components/schemas/VetusteDecompteLigne' } }
    VetusteDecompteLigne:
      type: object
      description: "Modelo Dart: VetusteDecompteLigneModel (tabela vetuste_decompte_ligne). valeur_residuelle = valeur_achat × (1 − abattement_pct/100)."
      properties:
        id: { type: integer }
        decompte_id: { type: integer }
        equipement: { type: string }
        categorie: { type: string, nullable: true }
        valeur_achat: { type: number }
        date_acquisition: { type: string, format: date, nullable: true }
        age_annees: { type: number }
        etat_entree: { type: string, nullable: true, description: "N/B/U/M" }
        etat_sortie: { type: string, nullable: true, description: "N/B/U/M" }
        abattement_pct: { type: number }
        valeur_residuelle: { type: number }
        imputable: { type: boolean }
        notes: { type: string, nullable: true }
        ordre: { type: integer }
    ChargeReference:
      type: object
      description: "Modelo Dart: ChargeReferenceModel (tabela Charges_Reference). Éditée par le Super Admin (ChargesReferencePage)."
      properties:
        id: { type: integer }
        nom: { type: string }
        icone: { type: string }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        ordre: { type: integer }
    Recette:
      type: object
      description: |
        Modelo Dart: RecetteModel (tabela Recettes). Échéance (loyer, caution, décompte de
        vétusté, remboursement). **Une seule ligne vue des deux côtés** : le proprietaire
        via `owner_id`, le locataire via `locataire_id` (RLS `locataire_select_recettes`) —
        les libellés s'inversent selon `sens` et le profil, il n'y a pas deux écritures.
        ⚠️ **INSERT réservé au proprietaire** (`owner_all_recettes`) : quand le locataire
        signe en dernier, le rattrapage passe par `EtatDesLieuxDatasource.ensureBailEcheances`.
