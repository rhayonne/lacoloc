    EtatDesLieuxUpdate:
      type: object
      description: |
        Update parcial. Chemins usuels :
        `finaliser` → `{situation}` (+ `Chambres.est_loue` mis à jour à part : entrée finalisée → occupée, sortie finalisée → libérée) ·
        `locataireAccepter` → `{locataire_accepte, date_finalisation, locataire_signature_url, locataire_signed_at}` ·
        `setBailSignature` → `{bail_<role>_signature_url, bail_<role>_signed_at}` ·
        `setEdlAvenantWindow` → `{avenant_window_days}` ·
        `requestSignature` → `{last_signature_request_at}` ·
        `resilierBail` → `{bail_conge_date, bail_fin_effective, bail_resilie_motif, bail_resilie_at}` ·
        `annulerResiliation` → les mêmes remis à `null` ·
        `setActive` (super admin) → `{actif}`.
