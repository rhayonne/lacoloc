        date_paiement: { type: string, format: date, nullable: true }
        statut: { type: string, enum: [a_recevoir, recu, en_retard], description: "Indépendant de `sens` ; seul le libellé affiché change." }
        sens: { type: string, enum: [recevoir, payer], default: recevoir, description: "`recevoir` = dû AU proprietaire (loyer, caution, vétusté) · `payer` = dû PAR le proprietaire (ex. « Remboursement de la caution (fin de bail) », généré par _settleCaution)." }
        notes: { type: string, nullable: true, description: "Sert de discriminant applicatif : « Dépôt de garantie% » (caution d'entrée), « Remboursement de la caution (fin de bail) »." }
        created_at: { type: string, format: date-time }
