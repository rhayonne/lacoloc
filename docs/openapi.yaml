      properties:
        id: { type: integer }
        code: { type: string, nullable: true, readOnly: true, description: "Code de référence lisible, généré côté base à la création (trigger set_edl_code), unique. Format EDL-<E|S>-<IMM>-<INI>-<AAMMJJ>-<RND>, ex. EDL-E-CAEN-NL-260605-7F3K. Sert à localiser/rechercher l'EDL (locataire + proprio)." }
        proprietaire_id: { type: string, format: uuid }
