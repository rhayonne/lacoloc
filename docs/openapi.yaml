        chambre_id: { type: integer, nullable: true }
        type_bail: { type: string, enum: [location, individuel], description: "`location` = bail de location simple (ex-`collectif`, migré) · `individuel` = colocation (1 EDL privatif par chambre + 1 collectif de parties communes)." }
        type_edl: { type: string, enum: [entree, sortie] }
