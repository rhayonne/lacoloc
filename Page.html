<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <title>Demandes de contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>

  <style>
    :root {
      --primary: #0a6a86;
      --primary-deep: #0a4a5e;
      --primary-ink: #083b4c;
      --active-bg: #dbeef6;
      --active-bg-2: #eaf5fa;
      --bg-content: #f6f8fb;
      --line: #e7ecf0;
      --line-soft: #eff3f6;
      --text: #25333d;
      --text-2: #5b6772;
      --text-3: #93a0aa;
      --ok: #2f8a5b;
      --ok-soft: #e6f4ec;
      --amber: #c07a2b;
      --amber-soft: #fbf0e2;
      --shadow-sm: 0 1px 2px rgba(15, 35, 45, .05);
      --shadow-md: 0 6px 20px rgba(15, 35, 45, .08);
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg-content)
    }

    body {
      font-family: 'Roboto', system-ui, -apple-system, Segoe UI, sans-serif;
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased
    }

    #root {
      height: 100%
    }

    * {
      box-sizing: border-box
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
      font-size: inherit
    }

    a {
      color: var(--primary);
      text-decoration: none
    }

    a:hover {
      color: var(--primary-deep)
    }

    ::-webkit-scrollbar {
      width: 9px;
      height: 9px
    }

    ::-webkit-scrollbar-thumb {
      background: #cdd6dd;
      border-radius: 6px;
      border: 2px solid transparent;
      background-clip: content-box
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #b6c1c9;
      background-clip: content-box
    }

    .surface {
      background: var(--bg-content);
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column
    }

    /* primitives */
    .cc-av {
      border-radius: 50%;
      color: #fff;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      line-height: 1
    }

    .cc-toggle {
      position: relative;
      border-radius: 999px;
      background: #cdd6dd;
      padding: 3px;
      flex-shrink: 0;
      transition: background .18s
    }

    .cc-toggle.on {
      background: var(--primary)
    }

    .cc-toggle .knob {
      display: block;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
      transition: transform .2s cubic-bezier(.34, 1.3, .5, 1)
    }

    .cc-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap
    }

    .cc-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%
    }

    .cc-badge.est {
      background: var(--ok-soft);
      color: var(--ok)
    }

    .cc-badge.est .dot {
      background: var(--ok)
    }

    .cc-badge.new {
      background: var(--amber-soft);
      color: var(--amber)
    }

    .cc-badge.new .dot {
      background: var(--amber)
    }

    /* header */
    .phead {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 22px 24px 16px
    }

    .phead .htxt h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.01em;
      color: var(--primary-ink)
    }

    .phead .htxt p {
      margin: 2px 0 0;
      color: var(--text-3);
      font-size: 13px
    }

    .phead .count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 8px;
      border-radius: 11px;
      background: var(--active-bg);
      color: var(--primary-deep);
      font-size: 12px;
      font-weight: 700;
      margin-left: 2px
    }

    .phead .grow {
      flex: 1
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-2);
      transition: background .15s, color .15s, border-color .15s;
      box-shadow: var(--shadow-sm)
    }

    .icon-btn:hover {
      background: #f2f6f8;
      color: var(--primary);
      border-color: #cfe0e7
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px 16px
    }

    .searchbox {
      position: relative;
      flex: 1
    }

    .searchbox input {
      width: 100%;
      height: 44px;
      padding: 0 14px 0 44px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      box-shadow: var(--shadow-sm)
    }

    .searchbox input::placeholder {
      color: var(--text-3)
    }

    .searchbox input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(10, 106, 134, .13)
    }

    .searchbox .ic {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-3);
      pointer-events: none
    }

    /* V3 — liste + panneau détail */
    .split {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 0;
      border-top: 1px solid var(--line)
    }

    .rows {
      overflow: auto;
      padding: 14px 18px 24px;
      background: var(--bg-content)
    }

    .rowline {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 12px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: box-shadow .15s, border-color .15s
    }

    .rowline:hover {
      box-shadow: var(--shadow-md);
      border-color: #d3dee4
    }

    .rowline.on {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(10, 106, 134, .1)
    }

    .rowline .who {
      min-width: 170px;
      flex-shrink: 0
    }

    .rowline .who .nm {
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .rowline .who .nm .age {
      font-size: 12px;
      color: var(--text-3);
      font-weight: 400
    }

    .rowline .who .rm {
      font-size: 12px;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px
    }

    .rowline .snip {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .rowline .rmeta {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0
    }

    .rowline .dt {
      font-size: 12px;
      color: var(--text-3);
      white-space: nowrap
    }

    .detail {
      background: #fff;
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0
    }

    .detail .dhero {
      padding: 24px 22px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border-bottom: 1px solid var(--line-soft);
      background: linear-gradient(180deg, var(--active-bg-2), #fff)
    }

    .detail .dhero h3 {
      margin: 12px 0 2px;
      font-size: 18px;
      font-weight: 500
    }

    .detail .dhero .rm {
      font-size: 13px;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px
    }

    .detail .dbody {
      flex: 1;
      overflow: auto;
      padding: 18px 22px
    }

    .detail .field {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--line-soft)
    }

    .detail .field svg {
      color: var(--primary);
      flex-shrink: 0
    }

    .detail .field .k {
      font-size: 11.5px;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: .05em
    }

    .detail .field .v {
      font-size: 13.5px;
      color: var(--text);
      margin-top: 1px
    }

    .detail .estabrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg-content);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      margin: 16px 0 0
    }

    .detail .estabrow .lab {
      font-size: 13px;
      font-weight: 500
    }

    .detail .estabrow .hint {
      font-size: 11.5px;
      color: var(--text-3);
      margin-top: 1px
    }

    .detail .dfoot {
      padding: 16px 22px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 10px
    }

    .detail .dfoot .btn-disc,
    .detail .dfoot .btn-ghost {
      flex: 1;
      justify-content: center
    }

    .btn-ghost {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text-2);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: .15s;
      white-space: nowrap
    }

    .btn-ghost:hover {
      background: #f2f6f8;
      color: var(--primary);
      border-color: #cfe0e7
    }

    .btn-disc {
      background: var(--primary);
      color: #fff;
      border-radius: 10px;
      padding: 9px 15px;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: background .15s;
      white-space: nowrap
    }

    .btn-disc:hover {
      background: var(--primary-deep)
    }

    .btn-disc.locked {
      background: #eef2f5;
      color: var(--text-3);
      cursor: not-allowed
    }
  </style>
</head>

<body>

  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const { useState } = React;

    /* ---------------- Icons ---------------- */
    const Ic = {
      search: (p) => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" {...p}><circle cx="11" cy="11" r="6.5" stroke="currentColor" strokeWidth="1.7" /><path d="M20 20l-3.6-3.6" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" /></svg>,
      phone: (p) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" {...p}><path d="M5 4h3l1.5 4-2 1.5a12 12 0 005 5l1.5-2 4 1.5V19a2 2 0 01-2 2A15 15 0 013 6a2 2 0 012-2z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /></svg>,
      mail: (p) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" {...p}><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" strokeWidth="1.7" /><path d="M4 7l8 6 8-6" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" /></svg>,
      home: (p) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" {...p}><path d="M4 11l8-6 8 6v8a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1v-8z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /></svg>,
      cal: (p) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" {...p}><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" strokeWidth="1.7" /><path d="M4 9h16M8 3v4M16 3v4" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" /></svg>,
      user: (p) => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" {...p}><circle cx="12" cy="8" r="3.4" stroke="currentColor" strokeWidth="1.7" /><path d="M5.5 20c0-3.4 2.9-6 6.5-6s6.5 2.6 6.5 6" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" /></svg>,
      ext: (p) => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" {...p}><path d="M14 5h5v5M19 5l-8 8" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" /><path d="M18 14v4a2 2 0 01-2 2H6a2 2 0 01-2-2V8a2 2 0 012-2h4" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" /></svg>,
      chat: (p) => <svg width="17" height="17" viewBox="0 0 24 24" fill="none" {...p}><path d="M4 5h16v11H9l-4 3v-3H4V5z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /></svg>,
      lock: (p) => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" {...p}><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" strokeWidth="1.7" /><path d="M8 11V8a4 4 0 018 0v3" stroke="currentColor" strokeWidth="1.7" /></svg>,
      refresh: (p) => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" {...p}><path d="M20 11a8 8 0 10-1.5 5" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" /><path d="M20 5v6h-6" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" /></svg>,
    };

    /* ---------------- Sample data (remplacer par vos données API) ---------------- */
    const AV = ['#0a6a86', '#7a5bb0', '#3f8f5b', '#c07a2b', '#b0506e', '#4a72b8'];
    const REQ = [
      { id: 1, name: 'Camille Moreau', age: 25, tel: '+33 6 05 84 95 62 41', mail: 'camille.moreau@mail.com', room: 'Chambre 1', bldg: 'APT test coloc', date: '17/07/2026', time: '14:32', established: false, color: AV[0], snippet: 'Bonjour, la chambre est-elle toujours disponible pour septembre ?' },
      { id: 2, name: 'Lucas Bernard', age: 28, tel: '+33 6 12 44 87 03', mail: 'l.bernard@mail.com', room: 'Chambre 3', bldg: 'Résidence Voltaire', date: '16/07/2026', time: '09:10', established: true, color: AV[1], snippet: 'Parfait, je confirme la visite de jeudi à 18 h.' },
      { id: 3, name: 'Sofia Rossi', age: 23, tel: '+33 7 55 21 09 44', mail: 'sofia.rossi@mail.com', room: 'Studio', bldg: '12 rue des Lilas', date: '15/07/2026', time: '17:45', established: true, color: AV[2], snippet: 'Merci pour les informations, je prépare mon dossier.' },
      { id: 4, name: 'Yanis Benali', age: 31, tel: '+33 6 88 30 12 77', mail: 'y.benali@mail.com', room: 'Chambre 2', bldg: 'APT test coloc', date: '14/07/2026', time: '11:05', established: false, color: AV[3], snippet: 'Bonjour, je travaille en CDI, quel est le montant du dépôt ?' },
      { id: 5, name: 'Emma Laurent', age: 22, tel: '+33 7 41 66 92 18', mail: 'emma.laurent@mail.com', room: 'Chambre 4', bldg: 'Résidence Voltaire', date: '12/07/2026', time: '20:18', established: true, color: AV[4], snippet: 'Super, à bientôt pour la signature du bail !' },
      { id: 6, name: 'Thomas Petit', age: 27, tel: '+33 6 09 74 55 21', mail: 't.petit@mail.com', room: 'Studio', bldg: 'Le Central', date: '10/07/2026', time: '08:50', established: false, color: AV[5], snippet: 'Est-il possible de louer meublé à partir du 1er août ?' },
    ];

    const initials = (n) => n.split(' ').map(s => s[0]).slice(0, 2).join('').toUpperCase();

    /* ---------------- Primitives ---------------- */
    function Avatar({ r, size = 42, ring = false }) {
      return (
        <span className="cc-av" style={{
          width: size, height: size, background: r.color, fontSize: size * 0.36,
          boxShadow: ring ? '0 0 0 3px #fff, 0 0 0 4px ' + r.color : 'none'
        }}>
          {initials(r.name)}
        </span>
      );
    }
    function Toggle({ on, onChange, size = 'md' }) {
      const w = size === 'sm' ? 38 : 46, h = size === 'sm' ? 22 : 26, k = h - 6;
      return (
        <button className={'cc-toggle' + (on ? ' on' : '')} onClick={onChange} style={{ width: w, height: h }} aria-pressed={on}>
          <span className="knob" style={{ width: k, height: k, transform: on ? `translateX(${w - h}px)` : 'translateX(0)' }} />
        </button>
      );
    }
    function StatusBadge({ established }) {
      return established
        ? <span className="cc-badge est"><span className="dot" />Contact établi</span>
        : <span className="cc-badge new"><span className="dot" />Nouveau</span>;
    }

    /* ---------------- Page ---------------- */
    function DemandesContact() {
      const [sel, setSel] = useState(REQ[0].id);
      const [estab, setEstab] = useState(() => Object.fromEntries(REQ.map(r => [r.id, r.established])));
      const r = REQ.find(x => x.id === sel);
      const on = estab[sel];
      return (
        <div className="surface">
          <div className="phead">
            <div className="htxt">
              <h1>Demandes de contact <span className="count">{REQ.length}</span></h1>
              <p>Liste des candidats intéressés par vos annonces, avec leur fiche complète.</p>
            </div>
            <div className="grow" />
            <button className="icon-btn" title="Actualiser"><Ic.refresh /></button>
          </div>
          <div className="toolbar">
            <div className="searchbox">
              <span className="ic"><Ic.search /></span>
              <input placeholder="Rechercher un locataire ou dans les messages…" />
            </div>
          </div>

          <div className="split">
            <div className="rows">
              {REQ.map(x => (
                <div key={x.id} className={'rowline' + (x.id === sel ? ' on' : '')} onClick={() => setSel(x.id)}>
                  <Avatar r={x} size={40} />
                  <div className="who">
                    <div className="nm">{x.name}<span className="age">· {x.age}</span></div>
                    <div className="rm"><Ic.home />{x.room} — {x.bldg}</div>
                  </div>
                  <div className="snip">« {x.snippet} »</div>
                  <div className="rmeta">
                    <span className="dt">{x.date}</span>
                    <StatusBadge established={estab[x.id]} />
                  </div>
                </div>
              ))}
            </div>

            <div className="detail">
              <div className="dhero">
                <Avatar r={r} size={64} ring />
                <h3>{r.name}</h3>
                <div className="rm"><Ic.home />{r.room} — {r.bldg}</div>
              </div>
              <div className="dbody">
                <div className="field"><Ic.user /><div><div className="k">Âge</div><div className="v">{r.age} ans</div></div></div>
                <div className="field"><Ic.phone /><div><div className="k">Téléphone</div><div className="v">{r.tel}</div></div></div>
                <div className="field"><Ic.mail /><div><div className="k">E-mail</div><div className="v">{r.mail}</div></div></div>
                <div className="field"><Ic.cal /><div><div className="k">Demande reçue</div><div className="v">{r.date} à {r.time}</div></div></div>
                <div className="field" style={{ borderBottom: 'none' }}><Ic.ext /><div><div className="k">Annonce</div><a className="v" href="#">Voir l'annonce liée</a></div></div>
                <div className="estabrow">
                  <div>
                    <div className="lab">Contact établi</div>
                    <div className="hint">Débloque la discussion avec le candidat.</div>
                  </div>
                  <Toggle on={on} onChange={() => setEstab(s => ({ ...s, [sel]: !s[sel] }))} />
                </div>
              </div>
              <div className="dfoot">
                <button className="btn-ghost"><Ic.mail />E-mail</button>
                {on
                  ? <button className="btn-disc"><Ic.chat />Discuter</button>
                  : <button className="btn-disc locked"><Ic.lock />Discuter</button>}
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DemandesContact />);
  </script>

</body>

</html>
